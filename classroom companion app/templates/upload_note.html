{% extends "base.html" %}
{% block content %}
<h3>Upload Note</h3>
<form method="post" enctype="multipart/form-data">
  <div class="mb-3"><label>Subject</label>
    <select name="subject" class="form-control">
      {% for s in subjects %}<option>{{ s }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3"><label>Title</label><input name="title" class="form-control"></div>
  <div class="mb-3"><label>File</label><input name="file" type="file" class="form-control"></div>
  <button class="btn btn-primary">Upload</button>
</form>
{% endblock %}
