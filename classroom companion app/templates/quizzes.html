{% extends "base.html" %}
{% block content %}
<h4>Quizzes</h4>
{% if user.role == 'teacher' %}
<form method="post" class="mb-3">
  <div class="mb-2"><input name="title" class="form-control" placeholder="Quiz title"></div>
  <div class="mb-2"><textarea name="data" class="form-control" placeholder="Quiz JSON or text (optional)"></textarea></div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="generate_ai" value="1" id="genai">
    <label class="form-check-label" for="genai">Auto-generate quiz using AI</label>
  </div>
  <div class="mb-2 mt-2">
    <input class="form-control" name="ai_topic" placeholder="If using AI, enter topic here">
  </div>
  <button class="btn btn-primary btn-sm">Create Quiz</button>
</form>
{% endif %}
<ul class="list-group">
  {% for q in quizzes %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div><strong>{{ q[1] }}</strong><div class="small text-muted">By {{ q[2] }}</div></div>
      <div>
        {% if user.role == 'student' %}
          <a href="{{ url_for('take_quiz', quiz_id=q[0]) }}" class="btn btn-sm btn-outline-primary">Take</a>
        {% else %}
          <span class="small text-muted">Created</span>
        {% endif %}
      </div>
    </li>
  {% endfor %}
</ul>
{% endblock %}
