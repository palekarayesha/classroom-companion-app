{% extends "base.html" %}
{% block content %}
<h3>Notices</h3>
{% if user.role == 'admin' %}
<form method="post" class="mb-3">
  <textarea name="message" placeholder="Write notice" class="form-control mb-2"></textarea>
  <button class="btn btn-primary">Post Notice</button>
</form>
{% endif %}
<ul class="list-group">
  {% for n in notices %}<li class="list-group-item">{{ n.message }}</li>{% endfor %}
</ul>
{% endblock %}
