{% extends "base.html" %}
{% block content %}
<h4>Timetable</h4>
<div class="row">
  <div class="col-md-6">
    <img src="{{ url_for('static', filename='images/timetable_class.png') }}" class="img-fluid rounded" alt="class timetable">
  </div>
  <div class="col-md-6">
    <h6>University Exam Timetable</h6>
    <ul class="list-group">
      {% for d,sub in uni_tt %}
        <li class="list-group-item"><strong>{{ d }}</strong> — {{ sub }}</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
